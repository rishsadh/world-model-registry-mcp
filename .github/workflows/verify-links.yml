name: verify-links

# Refreshes the registry copy, checks every source link, and rebuilds AWESOME.md.
#
# The schedule is OFF until launch. To turn it on, uncomment the three lines under `schedule`.
# Until then this runs only when someone starts it from the Actions tab.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '17 5 * * 1'
  #     # Mondays, 05:17 UTC

permissions:
  contents: write

concurrency:
  group: verify-links
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh the registry copy from its canonical URL
        run: node bin/cli.mjs update --to-bundle
      - name: Check every source link
        run: node bin/cli.mjs verify --write data/liveness.json
      - name: Rebuild the list
        run: node bin/cli.mjs awesome --write AWESOME.md
      - name: Run the tests
        run: npm test
      - name: Commit what changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data AWESOME.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Refresh registry copy, link check and list"
            git push
          fi
